<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D World - Photo Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <base target="_blank">
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="entry-overlay" id="entry-overlay">
        <div class="entry-content">
            <h2>✨ Selamat Datang ✨</h2>
            <p>Double-click di mana saja untuk masuk</p>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container" class="blurred"></div>

    <div class="ui-overlay">
        <div class="instructions">
            <p>🖱️ Drag to rotate • 🤏 Pinch to zoom • 👆 Double-click for effects</p>
        </div>
    </div>

    <div class="floating-images" id="floating-images"></div>

    <div class="letter-modal" id="letter-modal">
        <div class="letter-content">
            <button class="close-letter" id="close-letter">✕</button>
            <h2>Thư Mật 💕</h2>
            <div class="heart-icon">💖</div>
            <p>
                Halo! Selamat datang di dunia 3D-ku.<br><br>
                Setiap bintang di sini mewakili sebuah mimpi,<br>
                setiap partikel adalah sebuah kenangan indah.<br><br>
                Terima kasih sudah mampir! 🌟
            </p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="script.js"></script>
</body>
</html>
